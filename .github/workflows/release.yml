name: Publish Pillars of Faith for Foundry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine module version
        id: version
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('module.json', 'utf8')).version")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Check whether version was already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - name: Build release archive
        if: env.skip != 'true'
        run: |
          mkdir -p dist
          cp module.json dist/
          for dir in module scripts packs; do
            if [ -d "$dir" ]; then cp -a "$dir" dist/; fi
          done
          cd dist
          zip -qr ../trg-pillars-of-faith.zip .
          cd ..
          unzip -p trg-pillars-of-faith.zip module.json | node -e "let s='';process.stdin.on('data',b=>s+=b).on('end',()=>{const m=JSON.parse(s);if(m.id!=='trg-pillars-of-faith')process.exit(1)})"
      - name: Publish GitHub Release
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" trg-pillars-of-faith.zip --target "$GITHUB_SHA" --title "$TAG" --notes "Pillars of Faith Foundry VTT module $TAG"
      - uses: actions/upload-artifact@v4
        if: env.skip != 'true'
        with:
          name: pillars-of-faith-package
          path: trg-pillars-of-faith.zip
